
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRE-BALANCE</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

header {
    text-align: center;
    padding: 9px;
    background: #172033;
    border-bottom: 2px solid #64748b;
}

header h1 {
    margin: 3px;
    font-size: 27px;
    letter-spacing: 2px;
}

#info {
    display: flex;
    justify-content: space-around;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 9px;
    font-size: 19px;
    font-weight: bold;
}

/* OCULTAR CONTADORES EN PANTALLA */
#info {
    display: none !important;
}

#tablero {
    display: grid;
    grid-template-columns: 1fr 1fr;
    width: 100%;
    min-height: 390px;
}

.columna {
    padding: 12px;
    min-width: 0;
    text-align: center;
}

#activos {
    background: #291313;
    border-right: 3px solid white;
}

#pasivos {
    background: #101f3c;
}

.titulo {
    font-size: 27px;
    font-weight: bold;
    padding: 8px;
    margin-bottom: 10px;
}

#activos .titulo {
    color: #ff5555;
}

#pasivos .titulo {
    color: #55aaff;
}

.cuentas {
    display: grid;
    grid-template-columns: 1fr;
    gap: 6px;
}

.cuenta {
    min-height: 39px;
    padding: 8px 5px;
    border: 2px dashed #aaa;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    background: #202b3b;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 4px;
}

#activos .cuenta {
    border-color: #ff6666;
}

#pasivos .cuenta {
    border-color: #559dff;
}

.cuenta.seleccionada {
    outline: 3px solid yellow;
    background: #46546b;
}

.cuenta.completada {
    background: #14532d;
    border: 2px solid #22c55e;
    color: white;
    cursor: default;
}

.valor-cuenta {
    color: #facc15;
    white-space: nowrap;
}

.totales {
    margin-top: 12px;
    padding: 10px;
    border-radius: 9px;
    background: #101827;
    font-size: 16px;
    line-height: 1.8;
}

.fila-total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
}

.fila-total .total-actual,
.fila-total .total-ideal {
    font-size: 19px;
    font-weight: bold;
}

.total-actual {
    color: #22e6a0;
    font-size: 22px;
    font-weight: bold;
}

.total-ideal {
    color: #facc15;
    font-size: 21px;
    font-weight: bold;
}

#origen {
    padding: 12px;
    background: #202b3b;
    border-top: 3px solid white;
}

#origen h2 {
    text-align: center;
    font-size: 23px;
    margin: 5px;
}

#instruccion {
    text-align: center;
    color: #facc15;
    font-size: 15px;
    margin: 8px;
}

.grupos-piezas {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.grupo {
    border: 1px solid #64748b;
    border-radius: 8px;
    padding: 8px;
}

.grupo h3 {
    text-align: center;
    font-size: 17px;
}

.piezas {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 7px;
}

/*.pieza {
    border: 2px solid white;
    border-radius: 7px;
    padding: 10px 4px;
    font-size: 13px;
    font-weight: bold;
    color: white;
    cursor: pointer;
    min-height: 55px;
    transition: transform .15s;
    overflow-wrap: anywhere;
}*/

.pieza {
    border: 2px solid white;
    border-radius: 7px;
    padding: 12px 4px;
    font-size: 20px;
    font-weight: bold;
    color: white;
    cursor: pointer;
    min-height: 60px;
    transition: transform .15s;
    overflow-wrap: anywhere;
}

.pieza:active {
    transform: scale(.94);
}

.pieza.activo {
    background: #d71920;
}

.pieza.pasivo {
    background: #0756bd;
}

.pieza.seleccionada {
    outline: 4px solid yellow;
    transform: scale(1.04);
}

.pieza.usada {
    display: none;
}

footer {
    background: #111827;
    color: silver;
    text-align: center;
    padding: 10px;
    font-size: 12px;
}

/* MENSAJE DE INICIO */

#inicio {
    position: fixed;
    inset: 0;
    background: #050914;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    overflow: hidden;
    animation: desaparecer 1s forwards;
}

#inicio span {
    font-size: 110px;
    animation: zoomDinero 1s ease-in forwards;
}

@keyframes zoomDinero {
    0% {
        transform: scale(.1) rotate(0deg);
        opacity: 1;
    }
    100% {
        transform: scale(35) rotate(720deg);
        opacity: 0;
    }
}

@keyframes desaparecer {
    0%, 85% { opacity: 1; }
    100% { opacity: 0; visibility: hidden; }
}

/* ACIERTO Y ERROR */

#efecto {
    position: fixed;
    inset: 0;
    z-index: 900;
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    font-size: 120px;
}

#efecto.mostrar {
    display: flex;
    animation: zoomEfecto .3s ease-out forwards;
}

@keyframes zoomEfecto {
    0% {
        transform: scale(.1);
        opacity: 0;
    }
    60% {
        transform: scale(1.35);
        opacity: 1;
    }
    100% {
        transform: scale(1);
        opacity: 0;
    }
}

/* RESULTADO FINAL */

#final {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: rgba(0,0,0,.97);
    justify-content: center;
    align-items: center;
    text-align: center;
}

#final.concluido {
    display: flex;
}

#resultado {
    width: 90%;
    max-width: 550px;
    padding: 35px 15px;
    border: 3px solid gold;
    border-radius: 20px;
    background: #172033;
}

#resultado h1 {
    font-size: 28px;
    color: gold;
}

#nota {
    font-size: 85px;
    font-weight: bold;
    color: #22e6a0;
}

#fechaFinal {
    font-size: 17px;
    color: white;
    line-height: 1.8;
}

@media(max-width:600px) {
    header h1 {
        font-size: 20px;
    }

    #tablero {
        min-height: 0;
    }

    .columna {
        padding: 6px;
    }

    .titulo {
        font-size: 19px;
    }

    .cuenta {
        font-size: 11px;
        min-height: 43px;
        padding: 5px 2px;
    }

    .valor-cuenta {
        font-size: 10px;
    }

/*    .totales {
        padding: 5px;
        font-size: 12px;
    }

    .total-actual,
    .total-ideal {
        font-size: 15px;
    } */


.totales {
    padding: 5px;
    font-size: 12px;
}

/* UBICAR LOS VALORES DEBAJO DE SUS LEYENDAS */
.fila-total {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 2px;
    white-space: normal;
    text-align: center;
    margin-bottom: 8px;
}

.total-actual,
.total-ideal {
    font-size: 16px;
    font-weight: bold;
}


    .piezas {
        grid-template-columns: 1fr;
    }

    /*.pieza {
        font-size: 11px;
        min-height: 43px;
        padding: 7px 2px;
    }*/

.pieza {
    font-size: 19px;
    min-height: 55px;
    padding: 9px 2px;
}

    #origen h2 {
        font-size: 18px;
    }

    #info {
        font-size: 15px;
    }

    #efecto {
        font-size: 90px;
    }
}


</style>
</head>

<body>

<!-- MENSAJE DE INICIO -->

<div id="inicio">
    <span>💰</span>
</div>

<div id="efecto"></div>

<header>
    <h1>PRE-BALANCE</h1>
</header>

<div id="info">
    <div>⏱️ TIEMPO: <span id="tiempo">120</span> s</div>
    <div>✔️ ACIERTOS: <span id="aciertos">0</span></div>
    <div>❌ ERRORES: <span id="errores">0</span></div>
</div>

<!-- TABLERO DIVIDIDO EN DOS PARTES -->

<div id="tablero">

    <!-- ACTIVOS -->

    <section class="columna" id="activos">

        <div class="titulo">🔴 ACTIVOS</div>

        <div class="cuentas" id="cuentasActivos"></div>

        <!--div class="totales">
            TOTAL ACTIVOS ACTUAL:
            <div class="total-actual" id="actualActivos">$0</div>

            TOTAL ACTIVOS IDEAL:
            <div class="total-ideal" id="idealActivos">$0</div>
        </div-->

	<div class="totales">

	    <div class="fila-total">
	        <span>TOTAL ACTIVOS ACTUAL:</span>
	        <span class="total-actual" id="actualActivos">$0</span>
	    </div>

	    <div class="fila-total">
	        <span>TOTAL ACTIVOS IDEAL:</span>
	        <span class="total-ideal" id="idealActivos">$0</span>
	    </div>

	</div>

    </section>

    <!-- PASIVOS -->

    <section class="columna" id="pasivos">

        <div class="titulo">🔵 PASIVOS</div>

        <div class="cuentas" id="cuentasPasivos"></div>

        <!--div class="totales">
            TOTAL PASIVOS ACTUAL:
            <div class="total-actual" id="actualPasivos">$0</div>

            TOTAL PASIVOS IDEAL:
            <div class="total-ideal" id="idealPasivos">$0</div>
        </div-->

	<div class="totales">

	    <div class="fila-total">
	        <span>TOTAL PASIVOS ACTUAL:</span>
	        <span class="total-actual" id="actualPasivos">$0</span>
	    </div>

	    <div class="fila-total">
	        <span>TOTAL PASIVOS IDEAL:</span>
	        <span class="total-ideal" id="idealPasivos">$0</span>
	    </div>

	</div>

    </section>

</div>

<!-- ZONA DE PIEZAS -->

<section id="origen">

    <!--h2>📦 ZONA DE ORIGEN: 28 PIEZAS</h2>

    <div id="instruccion">
        1. Selecciona una pieza.
        2. Selecciona la cuenta donde corresponde.
    </div-->

    <div class="grupos-piezas">

        <div class="grupo">
            <!--h3 style="color:#ff5555">🔴 PIEZAS DE ACTIVOS</h3-->
            <div class="piezas" id="piezasActivos"></div>
        </div>

        <div class="grupo">
            <!--h3 style="color:#55aaff">🔵 PIEZAS DE PASIVOS</h3-->
            <div class="piezas" id="piezasPasivos"></div>
        </div>

    </div>

</section>

<footer>
    Material didáctico del profesor JOSÉ VEGA | Talca - Chile (2026)
</footer>

<!-- MENSAJE FINAL PERMANENTE -->

<div id="final">
    <div id="resultado">
        <h1>NOTA FINAL</h1>
        <div id="nota">1,0</div>
        <div id="fechaFinal"></div>
    </div>
</div>

<script>

// ======================================
// 1. LISTADO FUENTE DE LAS 14 CUENTAS
// ======================================

const cuentasActivos = [
    {id:"caja", nombre:"CAJA", valor:500000},
    {id:"banco", nombre:"BANCO", valor:1200000},
    {id:"raices", nombre:"BIENES RAÍCES", valor:4000000},
    {id:"vehiculos", nombre:"VEHÍCULOS", valor:2500000},
    {id:"mercaderias", nombre:"MERCADERÍAS", valor:1800000},
    {id:"clientes", nombre:"CLIENTES", valor:900000},
    {id:"documentosCobrar", nombre:"DOCUMENTOS POR COBRAR", valor:700000}
];

const cuentasPasivos = [
    {id:"proveedores", nombre:"PROVEEDORES", valor:1500000},
    {id:"documentosPagar", nombre:"DOCUMENTOS POR PAGAR", valor:2000000},
    {id:"capital", nombre:"CAPITAL", valor:2500000},
    {id:"arriendos", nombre:"(-) ARRIENDOS", valor:900000},
    {id:"gastos", nombre:"(-) GASTOS GENERALES", valor:700000},
    {id:"ventas", nombre:"VENTAS", valor:3000000},
    {id:"otros", nombre:"OTROS INGRESOS", valor:4200000}
];

// ======================================
// 2. LISTADO FUENTE DE LAS PIEZAS
// ======================================

// Cada cuenta tiene una pieza correcta
// y una pieza distractora similar.

/* const distractoresActivos = [
    "CAJA CHICA",
    "BANCO DE SANGRE",
    "BIENES MUEBLES",
    "VEHÍCULOS ARRENDADOS",
    "MERCADERÍAS VENCIDAS",
    "CLIENTES POTENCIALES",
    "DOCUMENTOS POR PAGAR"
];

const distractoresPasivos = [
    "PROVEEDORES POTENCIALES",
    "DOCUMENTOS POR COBRAR",
    "CAPITAL HUMANO",
    "ARRIENDO PAGADO",
    "GASTOS PERSONALES",
    "VENTAS PROYECTADAS",
    "OTROS EGRESOS"
]; */

const distractoresActivos = [
    550000,
    1100000,
    3800000,
    2700000,
    1700000,
    950000,
    650000
];

const distractoresPasivos = [
    1650000,
    1900000,
    2700000,
    750000,
    650000,
    2800000,
    2400000
];


// ======================================
// 3. VARIABLES DEL JUEGO
// ======================================

let piezaSeleccionada = null;
let aciertos = 0;
let errores = 0;

let totalActivos = 0;
let totalPasivos = 0;

let idealActivos = cuentasActivos.reduce(
    (s,c) => s+c.valor,0
);

/* let idealPasivos = cuentasPasivos.reduce(
    (s,c) => s+c.valor,0
); */

/* let idealPasivos = cuentasPasivos.reduce(
    (s,c) => s+c.valor,0
) - 900000 - 700000; */

let idealPasivos = cuentasPasivos.reduce(
    (s,c) => s+c.valor,0
) - 2*900000 - 2*700000;

let segundos = 120;
let terminado = false;
let reloj = null;

const formato = new Intl.NumberFormat("es-CL", {
    style:"currency",
    currency:"CLP",
    maximumFractionDigits:0
});

// ======================================
// 4. CREAR LAS CUENTAS DE DESTINO
// ======================================

function crearCuentas(lista, contenedor) {

    lista.forEach(cuenta => {

        const div = document.createElement("div");

        div.className = "cuenta";

        div.dataset.id = cuenta.id;

        div.innerHTML = `
            <span>${cuenta.nombre}</span>
            <span class="valor-cuenta">
                ${formato.format(cuenta.valor)}
            </span>
        `;

        div.addEventListener("click", () => {
            seleccionarCuenta(div, cuenta);
        });

        contenedor.appendChild(div);

    });

}

crearCuentas(
    cuentasActivos,
    document.getElementById("cuentasActivos")
);

crearCuentas(
    cuentasPasivos,
    document.getElementById("cuentasPasivos")
);

// ======================================
// 5. CREAR LAS 28 PIEZAS
// ======================================

let piezas = [];

cuentasActivos.forEach((c,i) => {

piezas.push({
    id:"A"+i,
    nombre:c.nombre,
    cuenta:c.id,
    valor:c.valor,
    valorMostrado:c.valor,
    tipo:"activo",
    correcta:true
});

piezas.push({
    id:"AD"+i,
    nombre:"DISTRACTOR",
    cuenta:"distractor",
    valor:0,
    valorMostrado:distractoresActivos[i],
    tipo:"activo",
    correcta:false
});

});

cuentasPasivos.forEach((c,i) => {

piezas.push({
    id:"P"+i,
    nombre:c.nombre,
    cuenta:c.id,
    valor:c.valor,
    valorMostrado:c.valor,
    tipo:"pasivo",
    correcta:true
});

piezas.push({
    id:"PD"+i,
    nombre:"DISTRACTOR",
    cuenta:"distractor",
    valor:0,
    valorMostrado:distractoresPasivos[i],
    tipo:"pasivo",
    correcta:false
});

});

// Mezclar piezas aleatoriamente

function mezclar(lista) {

    for(let i=lista.length-1;i>0;i--) {

        const j=Math.floor(Math.random()*(i+1));

        [lista[i],lista[j]]=[lista[j],lista[i]];

    }

    return lista;
}

// ======================================
// 6. PRESENTAR PIEZAS
// ======================================

function crearPiezas() {

    mezclar(piezas);

    piezas.forEach(p => {

        const boton=document.createElement("button");

        boton.className="pieza "+p.tipo;

        /* boton.textContent=p.nombre; */

	boton.textContent=formato.format(p.valorMostrado);

        boton.dataset.id=p.id;

        boton.addEventListener("click", () => {
            seleccionarPieza(boton,p);
        });

        if(p.tipo==="activo") {

            document.getElementById("piezasActivos")
                .appendChild(boton);

        } else {

            document.getElementById("piezasPasivos")
                .appendChild(boton);

        }

    });

}

crearPiezas();

// ======================================
// 7. SELECCIONAR UNA PIEZA
// ======================================

function seleccionarPieza(boton,p) {

    if(terminado || boton.classList.contains("usada")) {
        return;
    }

    document.querySelectorAll(".pieza").forEach(b => {
        b.classList.remove("seleccionada");
    });

    piezaSeleccionada = {
        boton:boton,
        datos:p
    };

    boton.classList.add("seleccionada");

}

// ======================================
// 8. SELECCIONAR CUENTA Y VALIDAR
// ======================================

function seleccionarCuenta(div,cuenta) {

    if(terminado) return;

    if(!piezaSeleccionada) return;

    if(div.classList.contains("completada")) return;

    const p=piezaSeleccionada.datos;

    const boton=piezaSeleccionada.boton;

    const tipoCorrecto =
        (p.tipo==="activo" &&
         cuentasActivos.some(c=>c.id===cuenta.id))
        ||
        (p.tipo==="pasivo" &&
         cuentasPasivos.some(c=>c.id===cuenta.id));

    const respuestaCorrecta =
        p.correcta &&
        tipoCorrecto &&
        p.cuenta===cuenta.id;

    if(respuestaCorrecta) {

        aciertos++;

        /* if(p.tipo==="activo") {
            totalActivos+=p.valor;
        } else {
            totalPasivos+=p.valor;
        } */

  	if(p.tipo==="activo") {

	    totalActivos+=p.valor;

	} else {

	    // DESCONTAR ARRIENDOS Y GASTOS GENERALES
	    if(p.cuenta==="arriendos" || p.cuenta==="gastos") {

	        totalPasivos-=p.valor;

	    } else {

	        totalPasivos+=p.valor;
	    }
	} 


        boton.classList.add("usada");

        div.classList.add("completada");

        div.classList.remove("seleccionada");

        div.style.cursor="default";

        div.innerHTML=`
            <span>✔ ${cuenta.nombre}</span>
            <span class="valor-cuenta">
                ${formato.format(cuenta.valor)}
            </span>
        `;

        mostrarEfecto("✔️","#168bff");

    } else {

        errores++;

        mostrarEfecto("❌","#ff2222");

    }

    piezaSeleccionada=null;

    document.querySelectorAll(".pieza").forEach(b => {
        b.classList.remove("seleccionada");
    });

    actualizarMarcadores();

    comprobarFinal();

}

// ======================================
// 9. ACTUALIZAR TOTALES Y MARCADORES
// ======================================

function actualizarMarcadores() {

    document.getElementById("aciertos").textContent=aciertos;

    document.getElementById("errores").textContent=errores;

    document.getElementById("actualActivos").textContent=
        formato.format(totalActivos);

    document.getElementById("actualPasivos").textContent=
        formato.format(totalPasivos);

    document.getElementById("idealActivos").textContent=
        formato.format(idealActivos);

    document.getElementById("idealPasivos").textContent=
        formato.format(idealPasivos);

}

// ======================================
// 10. EFECTO ZOOM DE ACIERTO Y ERROR
// ======================================

function mostrarEfecto(simbolo,color) {

    const efecto=document.getElementById("efecto");

    efecto.textContent=simbolo;

    efecto.style.color=color;

    efecto.classList.remove("mostrar");

    void efecto.offsetWidth;

    efecto.classList.add("mostrar");

    setTimeout(()=>{
        efecto.classList.remove("mostrar");
    },300);

}

// ======================================
// 11. COMPROBAR CONDICIÓN DE FINALIZACIÓN
// ======================================

function comprobarFinal() {

    if(
        totalActivos===idealActivos &&
        totalPasivos===idealPasivos
    ) {

        finalizarJuego();

    }

}

// ======================================
// 12. CRONÓMETRO REGRESIVO
// ======================================

function iniciarReloj() {

    reloj=setInterval(()=>{

        if(terminado) return;

        segundos--;

        document.getElementById("tiempo").textContent=segundos;

        if(segundos<=0) {

            segundos=0;

            document.getElementById("tiempo").textContent=0;

            finalizarJuego();

        }

    },1000);

}

// ======================================
// 13. CALCULAR NOTA FINAL
// ======================================

function calcularNota() {

    const intentos=aciertos+errores;

    if(intentos===0) return 1;

    const nota=1+(6*aciertos/intentos);

    return Math.min(7,nota);

}

// ======================================
// 14. BLOQUEAR Y MOSTRAR RESULTADO
// ======================================

function finalizarJuego() {

    if(terminado) return;

    terminado=true;

    clearInterval(reloj);

    piezaSeleccionada=null;

    const nota=calcularNota();

    const notaTexto=nota.toFixed(1).replace(".",",");

    const ahora=new Date();

    const fecha=ahora.toLocaleDateString("es-CL");

    const hora=ahora.toLocaleTimeString("es-CL");

    document.getElementById("nota").textContent=notaTexto;

    document.getElementById("fechaFinal").innerHTML=
        fecha+"<br>"+hora;

    document.getElementById("final").classList.add("concluido");

}

// ======================================
// 15. INICIO AUTOMÁTICO
// ======================================

actualizarMarcadores();
